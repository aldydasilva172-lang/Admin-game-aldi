<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>ADMIN PANEL PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial;
  background:#0f0f0f;
  color:white;
  text-align:center;
  padding:15px;
}

h1{
  margin:15px 0;
  font-size:32px;
}

.card{
  background:#1a1a1a;
  border-radius:25px;
  padding:20px;
  margin-top:20px;
  box-shadow:0 0 15px rgba(0,0,0,0.5);
}

input{
  width:95%;
  max-width:400px;
  height:55px;
  border:none;
  border-radius:15px;
  margin:8px;
  font-size:18px;
  text-align:center;
  outline:none;
}

button{
  border:none;
  border-radius:15px;
  padding:14px 25px;
  margin:5px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.save{
  background:limegreen;
  color:white;
}

.reset{
  background:red;
  color:white;
}

.edit{
  background:orange;
  color:black;
}

.delete{
  background:#ff0044;
  color:white;
}

#fastestBox{
  margin-top:20px;
  background:linear-gradient(145deg,#222,#111);
  border-radius:25px;
  padding:30px 20px;
}

#fastName{
  font-size:35px;
  font-weight:bold;
  color:gold;
  margin-top:10px;
}

#fastTime{
  margin-top:15px;
  font-size:22px;
  color:#aaa;
}

#statusJawab{
  margin-top:18px;
  font-size:20px;
  color:lime;
  font-weight:bold;
}

.player{
  background:#222;
  border-radius:20px;
  padding:15px;
  margin-top:15px;
}

.bar{
  width:100%;
  height:20px;
  background:#333;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px;
}

.fill{
  height:100%;
  background:limegreen;
}

.rank{
  font-size:22px;
  margin-bottom:10px;
}

.kosong{
  font-size:22px;
  color:#888;
}

</style>
</head>

<body>

<h1>🎮 ADMIN PANEL</h1>

<div class="card">

<input
type="password"
id="pass"
placeholder="Password Admin">

<br>

<input
type="text"
id="nama"
placeholder="Nama Player">

<input
type="number"
id="score"
placeholder="Poin">

<br>

<button
class="save"
onclick="saveScore()">
SIMPAN / EDIT
</button>

<button
class="reset"
onclick="resetGame()">
RESET RONDE
</button>

</div>

<div class="card">

<h2>⚡ PLAYER TERCEPAT</h2>

<div id="fastestBox">

<div style="font-size:55px;">
🥇
</div>

<div id="fastName">
Belum Ada
</div>

<div id="fastTime">
Menunggu player pencet buzzer
</div>

<div id="statusJawab">
-
</div>

</div>

</div>

<div class="card">

<h2>🏆 KLASMEN</h2>

<div id="ranking"></div>

</div>

<script>

// ================= FIREBASE
const firebaseConfig = {

  apiKey: "AIzaSyXXXX",

  authDomain:
  "game-aldi.firebaseapp.com",

  databaseURL:
  "https://game-aldi-default-rtdb.asia-southeast1.firebasedatabase.app"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


// ================= PASSWORD
function cekPass(){

  return document
  .getElementById("pass")
  .value === "00";

}


// ================= SAVE SCORE
function saveScore(){

  if(!cekPass()){

    alert("Password salah!");
    return;

  }

  const nama =
  document.getElementById("nama").value.trim();

  const score =
  parseInt(
  document.getElementById("score").value
  );

  if(!nama || isNaN(score)){

    alert("Isi data!");
    return;

  }

  db.ref("ranking/" + nama).set(score);

  alert("Score berhasil disimpan!");

}


// ================= EDIT
function editPlayer(nama,score){

  document.getElementById("nama").value =
  nama;

  document.getElementById("score").value =
  score;

}


// ================= DELETE
function hapusPlayer(nama){

  if(!cekPass()){

    alert("Password salah!");
    return;

  }

  if(confirm("Hapus player?")){

    db.ref("ranking/" + nama).remove();

  }

}


// ================= RESET GAME
function resetGame(){

  if(!cekPass()){

    alert("Password salah!");
    return;

  }

  db.ref("game").set({

    clicked:false,
    player:"",
    time:""

  });

  alert("Ronde berhasil direset!");

}


// ================= PLAYER TERCEPAT
db.ref("game").on("value", snap => {

  const data = snap.val();

  if(!data){

    document.getElementById("fastName")
    .innerHTML = "Belum Ada";

    document.getElementById("fastTime")
    .innerHTML =
    "Menunggu player pencet buzzer";

    document.getElementById("statusJawab")
    .innerHTML = "-";

    return;

  }

  if(data.clicked){

    document.getElementById("fastName")
    .innerHTML =
    data.player || "Tidak diketahui";

    document.getElementById("fastTime")
    .innerHTML =
    "⏰ " + (data.time || "-");

    document.getElementById("statusJawab")
    .innerHTML =
    "🎤 BOLEH MENJAWAB";

  }else{

    document.getElementById("fastName")
    .innerHTML = "Belum Ada";

    document.getElementById("fastTime")
    .innerHTML =
    "Menunggu player pencet buzzer";

    document.getElementById("statusJawab")
    .innerHTML = "-";

  }

});


// ================= RANKING
db.ref("ranking").on("value", snap => {

  const data = snap.val() || {};

  let arr = [];

  for(let nama in data){

    arr.push({

      nama:nama,
      score:data[nama]

    });

  }

  arr.sort((a,b)=>b.score-a.score);

  let max =
  arr[0] ? arr[0].score : 1;

  let html = "";

  if(arr.length === 0){

    html = `
    <div class="kosong">
    Belum ada player
    </div>
    `;

  }

  arr.forEach((item,index)=>{

    let persen =
    (item.score/max)*100;

    html += `

    <div class="player">

      <div class="rank">

      ${index+1}. ${item.nama}
      — ${item.score} POINT

      </div>

      <div class="bar">

        <div
        class="fill"
        style="width:${persen}%">
        </div>

      </div>

      <br>

      <button
      class="edit"
      onclick="editPlayer(
      '${item.nama}',
      '${item.score}'
      )">

      EDIT

      </button>

      <button
      class="delete"
      onclick="hapusPlayer(
      '${item.nama}'
      )">

      HAPUS

      </button>

    </div>

    `;

  });

  document.getElementById("ranking")
  .innerHTML = html;

});

</script>

</body>
</html>
