<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>ADMIN PANEL ALDI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Poppins;
  background:#0b1020;
  color:white;
}
.container{max-width:700px;margin:auto;padding:20px}
.card{background:#141a33;padding:20px;border-radius:20px;margin-top:15px}
input{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none}
button{padding:10px;border:none;border-radius:10px;margin:5px;cursor:pointer}
.save{background:#00c3ff}
.reset{background:#ff5c5c}
.edit{background:#ffa600}
.delete{background:#ff2e63}
.player{padding:10px;background:#1c2344;margin-top:10px;border-radius:10px}
.bar{height:10px;background:#333;border-radius:10px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#00f0ff,#8a2eff)}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h2>CONTROL</h2>

<input type="password" id="pass" placeholder="Password">
<input type="text" id="nama" placeholder="Nama Player">
<input type="number" id="score" placeholder="Score">

<button class="save" onclick="saveScore()">Simpan</button>
<button class="reset" onclick="resetGame()">Reset</button>
</div>

<div class="card">
<h2>RANKING</h2>
<div id="ranking"></div>
</div>

</div>

<script>
// FIREBASE
const firebaseConfig = {
  apiKey:"AIzaSyXXXX",
  authDomain:"game-aldi.firebaseapp.com",
  databaseURL:"https://game-aldi-default-rtdb.asia-southeast1.firebasedatabase.app"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentKey = "";

// PASSWORD
function cekPass(){
  return document.getElementById("pass").value === "00";
}

// SAVE
function saveScore(){

  if(!cekPass()) return alert("Password salah!");

  const nama = document.getElementById("nama").value.trim();
  const score = parseInt(document.getElementById("score").value);

  if(!nama || isNaN(score)) return alert("Isi data!");

  const key = nama.replace(/\s/g,"_");

  db.ref("ranking/" + key).set({
    nama:nama,
    score:score
  });

}

// RESET
function resetGame(){
  if(!cekPass()) return alert("Password salah!");
  db.ref("game").set({clicked:false});
  alert("Reset sukses");
}

// EDIT
function editPlayer(key,score){
  currentKey = key;
  const newScore = prompt("Edit score:", score);
  if(newScore){
    db.ref("ranking/" + key + "/score").set(parseInt(newScore));
  }
}

// DELETE
function hapusPlayer(key){
  if(!cekPass()) return alert("Password salah!");
  if(confirm("Hapus player?")){
    db.ref("ranking/" + key).remove();
  }
}

// RANKING REALTIME
db.ref("ranking").on("value", snap => {

  const data = snap.val() || {};
  let arr = [];

  for(let key in data){
    arr.push({
      key:key,
      nama:data[key].nama,
      score:data[key].score
    });
  }

  arr.sort((a,b)=>b.score-a.score);

  let max = arr[0]?.score || 1;

  let html = "";

  arr.forEach((p,i)=>{

    html += `
    <div class="player">
      <h3>${i+1}. ${p.nama} - ${p.score}</h3>

      <div class="bar">
        <div class="fill" style="width:${(p.score/max)*100}%"></div>
      </div>

      <button class="edit" onclick="editPlayer('${p.key}',${p.score})">Edit</button>
      <button class="delete" onclick="hapusPlayer('${p.key}')">Hapus</button>

    </div>
    `;
  });

  document.getElementById("ranking").innerHTML = html;

});
</script>

</body>
</html>
