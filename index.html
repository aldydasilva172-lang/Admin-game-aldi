<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>ADMIN PANEL PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0f0f0f;
  font-family:Arial;
  color:white;
  text-align:center;
  padding:15px;
}

h1{
  margin:15px 0;
}

.card{
  background:#1a1a1a;
  border-radius:25px;
  padding:20px;
  margin-top:20px;
}

input{
  width:95%;
  max-width:400px;
  height:55px;
  border:none;
  border-radius:15px;
  margin:8px;
  text-align:center;
  font-size:18px;
}

button{
  border:none;
  border-radius:15px;
  padding:14px 25px;
  margin:5px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.save{
  background:limegreen;
  color:white;
}

.reset{
  background:red;
  color:white;
}

.edit{
  background:orange;
}

.delete{
  background:#ff0044;
  color:white;
}

.player{
  background:#222;
  padding:15px;
  border-radius:20px;
  margin-top:15px;
}

.bar{
  width:100%;
  height:20px;
  background:#333;
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}

.fill{
  height:100%;
  background:limegreen;
}

#fastBox{
  margin-top:15px;
  background:#222;
  border-radius:25px;
  padding:25px;
}

#fastName{
  font-size:35px;
  color:gold;
  margin-top:10px;
  font-weight:bold;
}

#fastTime{
  margin-top:10px;
  color:#aaa;
  font-size:20px;
}

#popup{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
}

.popup-content{
  background:#1a1a1a;
  width:90%;
  max-width:350px;
  padding:25px;
  border-radius:25px;
}

</style>
</head>

<body>

<h1>🎮 ADMIN PANEL</h1>

<div class="card">

<input
type="password"
id="pass"
placeholder="Password Admin">

<br>

<input
type="text"
id="nama"
placeholder="Nama Player">

<input
type="number"
id="score"
placeholder="Poin">

<br>

<button
class="save"
onclick="saveScore()">
SIMPAN
</button>

<button
class="reset"
onclick="resetGame()">
RESET RONDE
</button>

</div>

<div class="card">

<h2>⚡ PLAYER TERCEPAT</h2>

<div id="fastBox">

<div style="font-size:55px;">
🥇
</div>

<div id="fastName">
Belum ada
</div>

<div id="fastTime">
Menunggu buzzer
</div>

</div>

</div>

<div class="card">

<h2>🏆 KLASMEN</h2>

<div id="ranking"></div>

</div>

<!-- POPUP EDIT -->

<div id="popup">

<div class="popup-content">

<h2 id="editTitle">
EDIT PLAYER
</h2>

<input
type="number"
id="editScore"
placeholder="Edit poin">

<br><br>

<button
class="save"
onclick="saveEdit()">
SAVE
</button>

<button
class="reset"
onclick="closePopup()">
BATAL
</button>

</div>

</div>

<script>

// ================= FIREBASE
const firebaseConfig = {

  apiKey:"AIzaSyXXXX",

  authDomain:
  "game-aldi.firebaseapp.com",

  databaseURL:
  "https://game-aldi-default-rtdb.asia-southeast1.firebasedatabase.app"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let currentPlayer = "";


// ================= PASSWORD
function cekPass(){

  return document
  .getElementById("pass")
  .value === "00";

}


// ================= SAVE PLAYER
function saveScore(){

  if(!cekPass()){

    alert("Password salah!");
    return;

  }

  const nama =
  document.getElementById("nama")
  .value.trim();

  const score =
  parseInt(
  document.getElementById("score")
  .value
  );

  if(!nama || isNaN(score)){

    alert("Isi data!");
    return;

  }

  db.ref("ranking/" + nama)
  .set(score);

  alert("Berhasil disimpan!");

}


// ================= RESET
function resetGame(){

  if(!cekPass()){

    alert("Password salah!");
    return;

  }

  db.ref("game").remove()
  .then(()=>{

    db.ref("game").set({

      clicked:false

    });

    alert("Ronde berhasil direset!");

  });

}


// ================= EDIT PLAYER
function editPlayer(nama,score){

  currentPlayer = nama;

  document
  .getElementById("popup")
  .style.display = "flex";

  document
  .getElementById("editTitle")
  .innerHTML = "EDIT " + nama;

  document
  .getElementById("editScore")
  .value = score;

}


// ================= SAVE EDIT
function saveEdit(){

  if(!cekPass()){

    alert("Password salah!");
    return;

  }

  const score =
  parseInt(
  document.getElementById("editScore")
  .value
  );

  if(isNaN(score)){

    alert("Isi poin!");
    return;

  }

  db.ref("ranking/" + currentPlayer)
  .set(score);

  closePopup();

}


// ================= CLOSE POPUP
function closePopup(){

  document
  .getElementById("popup")
  .style.display = "none";

}


// ================= DELETE
function hapusPlayer(nama){

  if(!cekPass()){

    alert("Password salah!");
    return;

  }

  if(confirm("Hapus player?")){

    db.ref("ranking/" + nama)
    .remove();

  }

}


// ================= PLAYER TERCEPAT
db.ref("game").on("value", snap => {

  const data = snap.val() || {};

  const nama =
  data.player ||
  data.winner ||
  data.firstPlayer ||
  "Belum ada";

  const waktu =
  data.time ||
  data.waktu ||
  "";

  if(data.clicked === true){

    document
    .getElementById("fastName")
    .innerHTML = nama;

    document
    .getElementById("fastTime")
    .innerHTML = "⏰ " + waktu;

  }else{

    document
    .getElementById("fastName")
    .innerHTML = "Belum ada";

    document
    .getElementById("fastTime")
    .innerHTML = "Menunggu buzzer";

  }

});


// ================= KLASMEN
db.ref("ranking").on("value", snap => {

  const data = snap.val() || {};

  let arr = [];

  for(let nama in data){

    arr.push({

      nama:nama,
      score:data[nama]

    });

  }

  arr.sort((a,b)=>b.score-a.score);

  let max =
  arr[0] ? arr[0].score : 1;

  let html = "";

  arr.forEach((item,index)=>{

    let persen =
    (item.score/max)*100;

    html += `

    <div class="player">

      <h3>

      ${index+1}. ${item.nama}
      — ${item.score} POIN

      </h3>

      <div class="bar">

        <div
        class="fill"
        style="width:${persen}%">
        </div>

      </div>

      <br>

      <button
      class="edit"
      onclick="editPlayer(
      '${item.nama}',
      '${item.score}'
      )">

      EDIT

      </button>

      <button
      class="delete"
      onclick="hapusPlayer(
      '${item.nama}'
      )">

      HAPUS

      </button>

    </div>

    `;

  });

  document
  .getElementById("ranking")
  .innerHTML = html;

});

</script>

</body>
</html>
