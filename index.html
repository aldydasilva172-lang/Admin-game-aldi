<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>ADMIN PANEL ALDI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
font-family:'Poppins',sans-serif;
min-height:100vh;
color:white;
overflow-x:hidden;
background:
linear-gradient(rgba(5,10,25,0.72),rgba(5,10,25,0.88)),
url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1600&auto=format&fit=crop');
background-size:cover;
background-position:center;
background-attachment:fixed;
}
body::before{
content:'';
position:fixed;
inset:0;
background:
radial-gradient(circle at top left,rgba(0,255,255,0.12),transparent 30%),
radial-gradient(circle at bottom right,rgba(255,170,0,0.14),transparent 30%);
pointer-events:none;
}
body::after{
content:'';
position:fixed;
width:450px;height:450px;
background:rgba(255,170,0,0.10);
border-radius:50%;
filter:blur(120px);
bottom:-120px;right:-120px;
}
.ship{
position:fixed;
bottom:25px;
left:25px;
font-size:45px;
opacity:0.7;
animation:floatShip 4s ease-in-out infinite;
}
@keyframes floatShip{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}

.header{
width:100%;
padding:22px;
text-align:center;
font-family:'Orbitron',sans-serif;
font-size:32px;
font-weight:900;
letter-spacing:3px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(15px);
border-bottom:1px solid rgba(255,255,255,0.08);
text-shadow:0 0 20px cyan;
box-shadow:0 0 25px rgba(0,255,255,0.15);
}

.container{
width:100%;
max-width:700px;
margin:auto;
padding:20px;
}

.card{
background:rgba(15,15,35,0.68);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,0.08);
border-radius:30px;
padding:25px;
margin-top:20px;
}

.card h2{
text-align:center;
color:#00f0ff;
font-family:'Orbitron',sans-serif;
text-shadow:0 0 12px cyan;
margin-bottom:20px;
}

input{
width:100%;
height:58px;
border:none;
outline:none;
border-radius:18px;
margin-top:12px;
padding:0 18px;
font-size:17px;
color:white;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.08);
}

input:focus{
border:1px solid cyan;
box-shadow:0 0 20px cyan;
}

input::placeholder{
color:#bbb;
}

.btn-group{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:18px;
}

button{
flex:1;
border:none;
border-radius:16px;
padding:15px;
cursor:pointer;
color:white;
font-size:15px;
font-weight:700;
font-family:'Orbitron',sans-serif;
}

.save{
background:linear-gradient(145deg,#00ff99,#00c3ff);
}

.reset{
background:linear-gradient(145deg,#ff004c,#ff7a00);
}

.edit{
background:linear-gradient(145deg,#ffb300,#ff6a00);
}

.delete{
background:linear-gradient(145deg,#ff004c,#c400ff);
}

#fastBox{
text-align:center;
padding:25px;
border-radius:25px;
background:rgba(255,255,255,0.05);
}

#fastName{
font-size:38px;
font-weight:900;
color:gold;
text-shadow:0 0 15px gold;
}

#fastTime{
margin-top:10px;
color:#bbb;
font-size:18px;
}

.player{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
border-radius:22px;
padding:18px;
margin-top:18px;
}

.player h3{
font-size:18px;
margin-bottom:12px;
}

.bar{
width:100%;
height:16px;
background:rgba(255,255,255,0.08);
border-radius:30px;
overflow:hidden;
}

.fill{
height:100%;
border-radius:30px;
background:linear-gradient(90deg,#00f0ff,#8a2eff,#ff00d4);
}

#popup{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.75);
justify-content:center;
align-items:center;
z-index:9999;
}

.popup-content{
width:90%;
max-width:350px;
background:rgba(15,15,35,0.95);
border:1px solid rgba(255,255,255,0.08);
border-radius:28px;
padding:25px;
}

.popup-content h2{
text-align:center;
color:#00f0ff;
font-family:'Orbitron',sans-serif;
margin-bottom:15px;
}
</style>
</head>

<body>

<div class="ship">🏴‍☠️</div>

<div class="header">🏴‍☠️ ADMIN PANEL GAME ALDI </div>

<div class="container">

<div class="card">
<h2>⚙️ CONTROL PANEL</h2>

<input type="password" id="pass" placeholder="PASSWORD ADMIN">
<input type="text" id="nama" placeholder="NAMA PLAYER">
<input type="number" id="score" placeholder="POIN PLAYER">

<div class="btn-group">
<button class="save" onclick="saveScore()">SIMPAN</button>
<button class="reset" onclick="resetGame()">RESET</button>
</div>
</div>

<div class="card">
<h2>⚡ PLAYER TERCEPAT</h2>

<div id="fastBox">
<div style="font-size:60px;">🥇</div>
<div id="fastName">Belum ada</div>
<div id="fastTime">Menunggu buzzer</div>
</div>

</div>

<div class="card">
<h2>🏆 RANKING PLAYER</h2>
<div id="ranking"></div>
</div>

</div>

<div id="popup">

<div class="popup-content">

<h2 id="editTitle">EDIT PLAYER</h2>

<input type="number" id="editScore" placeholder="EDIT POIN">

<div class="btn-group">
<button class="save" onclick="saveEdit()">SAVE</button>
<button class="reset" onclick="closePopup()">BATAL</button>
</div>

</div>

</div>

<script>

// ===== FIREBASE =====
const firebaseConfig = {
apiKey:"AIzaSyXXXX",
authDomain:"game-aldi.firebaseapp.com",
databaseURL:"https://game-aldi-default-rtdb.asia-southeast1.firebasedatabase.app"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let currentPlayer = "";

// ===== PASSWORD =====
function cekPass(){
return document.getElementById("pass").value.trim() === "00";
}

// ===== SAFE KEY =====
function safeKey(name){
return name
.trim()
.replace(/[.#$[\]/]/g,"_");
}

// ===== DISABLE BUTTON =====
function setLoading(btn,status,text=""){
if(status){
btn.disabled = true;
btn.style.opacity = "0.6";
btn.innerText = text || "LOADING...";
}else{
btn.disabled = false;
btn.style.opacity = "1";
}
}

// ===== SAVE SCORE =====
async function saveScore(){

const btn = event.target;

if(!cekPass()) return alert("Password salah!");

const nama = document.getElementById("nama").value.trim();
const score = parseInt(document.getElementById("score").value);

if(!nama || isNaN(score)){
return alert("Isi data!");
}

setLoading(btn,true,"MENYIMPAN");

try{

await db.ref("ranking/" + safeKey(nama)).set({
name:nama,
score:score
});

alert("Berhasil disimpan!");

document.getElementById("nama").value = "";
document.getElementById("score").value = "";

}catch(err){

alert("Gagal simpan: " + err.message);

}

setLoading(btn,false,"SIMPAN");

}

// ===== RESET GAME =====
async function resetGame(){

const btn = event.target;

if(!cekPass()) return alert("Password salah!");

if(!confirm("Reset ronde?")) return;

setLoading(btn,true,"RESET...");

try{

await db.ref("game").remove();

alert("Ronde direset!");

}catch(err){

alert("Gagal reset: " + err.message);

}

setLoading(btn,false,"RESET");

}

// ===== EDIT PLAYER =====
function editPlayer(key,nama,score){

currentPlayer = key;

document.getElementById("popup").style.display = "flex";

document.getElementById("editTitle").innerText = "EDIT " + nama;

document.getElementById("editScore").value = score;

}

// ===== SAVE EDIT =====
async function saveEdit(){

const btn = event.target;

if(!cekPass()) return alert("Password salah!");

const score = parseInt(document.getElementById("editScore").value);

if(isNaN(score)){
return alert("Isi poin!");
}

setLoading(btn,true,"SAVE...");

try{

await db.ref("ranking/" + currentPlayer).update({
score:score
});

alert("Poin diupdate!");

closePopup();

}catch(err){

alert("Gagal update: " + err.message);

}

setLoading(btn,false,"SAVE");

}

// ===== CLOSE POPUP =====
function closePopup(){

document.getElementById("popup").style.display = "none";

}

// ===== DELETE PLAYER =====
async function hapusPlayer(key){

if(!cekPass()) return alert("Password salah!");

if(!confirm("Hapus player ini?")) return;

try{

await db.ref("ranking/" + key).remove();

alert("Player berhasil dihapus!");

}catch(err){

alert("Gagal hapus: " + err.message);

}

}

// ===== FAST PLAYER =====
db.ref("game").on("value",(snap)=>{

const data = snap.val() || {};

if(data.clicked){

document.getElementById("fastName").innerText =
data.player || "Unknown";

document.getElementById("fastTime").innerText =
"⚡ PEMENANG RONDE";

}else{

document.getElementById("fastName").innerText =
"Belum ada";

document.getElementById("fastTime").innerText =
"Menunggu buzzer";

}

});

// ===== RANKING =====
db.ref("ranking").on("value",(snap)=>{

const data = snap.val() || {};

let arr = [];

for(let key in data){

arr.push({
key:key,
nama:data[key].name || key,
score:Number(data[key].score) || 0
});

}

arr.sort((a,b)=>b.score-a.score);

let max = arr[0]?.score || 1;

let html = "";

arr.forEach((item,i)=>{

let persen = (item.score / max) * 100;

html += `
<div class="player">

<h3>${i+1}. ${item.nama} — ${item.score} POIN</h3>

<div class="bar">
<div class="fill" style="width:${persen}%"></div>
</div>

<div class="btn-group">

<button class="edit"
onclick="editPlayer('${item.key}','${item.nama}',${item.score})">
EDIT
</button>

<button class="delete"
onclick="hapusPlayer('${item.key}')">
HAPUS
</button>

</div>

</div>
`;

});

document.getElementById("ranking").innerHTML = html;

});

</script>

</body>
</html>
