<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>ADMIN PANEL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>

body{
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
  padding:20px;
}

input{
  width:90%;
  max-width:350px;
  height:50px;
  border:none;
  border-radius:12px;
  text-align:center;
  font-size:18px;
  margin:10px;
}

button{
  padding:12px 25px;
  border:none;
  border-radius:10px;
  margin:5px;
  font-size:16px;
}

.save{
  background:limegreen;
}

.reset{
  background:red;
  color:white;
}

.edit{
  background:orange;
}

.delete{
  background:#ff0033;
  color:white;
}

.card{
  background:#1a1a1a;
  margin-top:25px;
  padding:20px;
  border-radius:20px;
}

.player{
  background:#222;
  padding:15px;
  border-radius:15px;
  margin:12px 0;
}

.bar{
  width:100%;
  height:20px;
  background:#333;
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}

.fill{
  height:100%;
  background:limegreen;
}

</style>
</head>

<body>

<h1>🔐 ADMIN PANEL</h1>

<input type="password"
id="pass"
placeholder="Password">

<br>

<input type="text"
id="nama"
placeholder="Nama Player">

<input type="number"
id="score"
placeholder="Poin">

<br>

<button class="save"
onclick="saveScore()">
SIMPAN / EDIT
</button>

<button class="reset"
onclick="resetGame()">
RESET RONDE
</button>

<div class="card">

<h2>🏅 KLASMEN ADMIN</h2>

<div id="ranking"></div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyXXXX",
  authDomain: "game-aldi.firebaseapp.com",
  databaseURL: "https://game-aldi-default-rtdb.asia-southeast1.firebasedatabase.app"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

function cekPass(){

  return document.getElementById("pass").value === "00";

}

// ================= SAVE SCORE
function saveScore(){

  if(!cekPass()){
    alert("Password salah!");
    return;
  }

  const nama =
  document.getElementById("nama").value;

  const score =
  parseInt(document.getElementById("score").value);

  if(!nama || isNaN(score)){
    alert("Isi data!");
    return;
  }

  db.ref("ranking/" + nama).set(score);

  alert("Data tersimpan!");

}

// ================= DELETE PLAYER
function hapusPlayer(nama){

  if(!cekPass()){
    alert("Password salah!");
    return;
  }

  if(confirm("Hapus player?")){

    db.ref("ranking/" + nama).remove();

  }

}

// ================= EDIT PLAYER
function editPlayer(nama,score){

  document.getElementById("nama").value = nama;

  document.getElementById("score").value = score;

}

// ================= RESET GAME
function resetGame(){

  if(!cekPass()){
    alert("Password salah!");
    return;
  }

  db.ref("game").set({
    clicked:false
  });

  alert("Ronde direset!");

}

// ================= RANKING
db.ref("ranking").on("value", snap => {

  const data = snap.val() || {};

  let arr = [];

  for(let nama in data){

    arr.push({
      nama:nama,
      score:data[nama]
    });

  }

  arr.sort((a,b)=>b.score-a.score);

  let max =
  arr[0] ? arr[0].score : 1;

  let html = "";

  arr.forEach((item,index)=>{

    let persen =
    (item.score/max)*100;

    html += `

    <div class="player">

      <h3>
      ${index+1}. ${item.nama}
      — ${item.score} POIN
      </h3>

      <div class="bar">
        <div class="fill"
        style="width:${persen}%"></div>
      </div>

      <br>

      <button class="edit"
      onclick="editPlayer(
      '${item.nama}',
      '${item.score}'
      )">
      EDIT
      </button>

      <button class="delete"
      onclick="hapusPlayer(
      '${item.nama}'
      )">
      HAPUS
      </button>

    </div>

    `;

  });

  document.getElementById("ranking").innerHTML = html;

});

</script>

</body>
</html>
